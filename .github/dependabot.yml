# ─────────────────────────────────────────────────────────
# Dependabot 版本更新
# 覆盖本仓库实际清单：Go（backend/go.mod）、npm（frontend）、
# GitHub Actions、前后端 Dockerfile。
# 每周一次 + 同生态 minor/patch 合并成一条 PR，降低噪音。
# 不纳入 docker-compose：MinIO 使用 latest / MINIO_IMAGE，
# 校园网约定勿钉死未验证 tag（见 deploy/docker-compose.yml）。
# 不改 branch protection / deploy / CAS / secrets。
# ─────────────────────────────────────────────────────────
version: 2
updates:
  # Go 后端：backend/go.mod + go.sum
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "module:devops"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # 前端：frontend/package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "module:devops"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # .github/workflows 里的 Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "module:devops"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # backend/Dockerfile、frontend/Dockerfile
  # 基础镜像实际在用：alpine 3.21、golang 1.25-alpine、node 22-alpine、nginx 1.27-alpine。
  # 只挡「跨大版本」，不挡安全补丁——原先的 ignore 写成 golang>=1.23 / node>=21，
  # 而这两个值都低于实际在用版本，等于把在用的 Go / Node 基础镜像的**全部**更新
  # （含安全补丁）都忽略掉了，属补丁管理失效，已改为按大版本放开。
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "module:devops"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 大版本升级（如 Go 2.x、Node 26）需人工评估，其余（含 patch 安全更新）放行。
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "alpine"
        update-types:
          - "version-update:semver-major"
