name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 供应链加固（审计项 S-19）：所有第三方 action 一律钉到 commit SHA，
# 不使用浮动 major tag（tag 可被上游改写指向恶意提交）。
# 下方注释里的版本号仅用于人工识别，升级时应显式改 SHA + 版本注释。
#
# 令牌最小化：本工作流各 job 只需读取仓库内容（docker-build 是 push: false，
# 产物上传走 artifact 服务而非 token 写权限）。显式声明 contents: read，
# 避免仓库/组织默认权限为读写时，在 pull_request 事件下把过宽的 GITHUB_TOKEN
# 暴露给未合并的 PR 代码。
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────
  # 后端检查
  # ─────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable
      TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starbyte
          POSTGRES_PASSWORD: starbyte
          POSTGRES_DB: starbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # 下限由 go.mod 的 go 指令决定：excelize v2.11.0 / x/net v0.55+
          # 要求 go 1.25，低版本工具链会直接拒绝构建。
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Format check
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go' || (echo "Code is not formatted. Run 'go fmt ./...'." && exit 1)

      - name: go vet
        run: go vet ./...

      # 不再用 `curl ... install.sh | sh`：那是把远端脚本直接喂给 shell，
      # 既无版本校验也无完整性校验。改为下载固定版本发布包 + sha256 校验。
      #
      # 注意：golangci-lint v1.59.1 是以 Go 1.22 构建的。它之所以还能分析
      # go 1.25 的模块，是因为 backend/.golangci.yml 显式设了 `run.go: '1.22'`
      # 把目标语言版本钉住。若要放宽该设置，必须同步升级 golangci-lint 到
      # v2.x（v1.64.8 及更早仍不支持 go 1.25），并迁移 .golangci.yml 到 v2 schema。
      - name: Install golangci-lint (pinned + checksum verified)
        run: |
          set -euo pipefail
          VER="1.59.1"
          TARBALL="golangci-lint-${VER}-linux-amd64.tar.gz"
          SHA256="c30696f1292cff8778a495400745f0f9c0406a3f38d8bb12cef48d599f6c7791"
          curl -sSfL -o "/tmp/${TARBALL}" \
            "https://github.com/golangci/golangci-lint/releases/download/v${VER}/${TARBALL}"
          echo "${SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/golangci-lint-${VER}-linux-amd64/golangci-lint" "$HOME/.local/bin/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Build
        run: go build -o starbyte-server ./cmd/server

      - name: Install migrate
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-migrate.sh"

      - name: Migrate test database
        run: migrate -path migrations -database "$TEST_DATABASE_URL" up

      - name: Test
        run: go test -v -race -count=1 -p 1 ./...

      - name: Coverage gate
        run: bash scripts/check-coverage.sh

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.out

  # ─────────────────────────────────────────────────────────
  # 前端检查
  # ─────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test & coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Type check & Build
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # 数据库迁移检查
  # ─────────────────────────────────────────────────────────
  db-migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starbyte
          POSTGRES_PASSWORD: starbyte
          POSTGRES_DB: starbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25'
          cache: false

      - name: Install migrate
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-migrate.sh"

      - name: Run migrations up
        run: |
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" up

      - name: Verify rollback and re-apply
        run: |
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" down 1
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" up

      - name: Preserve customized member approval templates
        run: psql "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" -X -v ON_ERROR_STOP=1 -f backend/migrations/tests/member_application_v2.sql

  # ─────────────────────────────────────────────────────────
  # Docker 镜像构建测试
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: backend
          target: production
          push: false
          load: true
          tags: starbyte-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: frontend
          target: production
          push: false
          load: true
          tags: starbyte-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify backend image size
        run: |
          SIZE=$(docker image inspect starbyte-backend:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Backend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 100 ]; then
            echo "::warning::后端镜像超过 100MB，建议优化"
          fi

      - name: Verify frontend image size
        run: |
          SIZE=$(docker image inspect starbyte-frontend:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Frontend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 100 ]; then
            echo "::warning::前端镜像超过 100MB，建议优化"
          fi
