name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 供应链加固（审计项 S-19）：所有第三方 action 一律钉到 commit SHA，
# 不使用浮动 major tag（tag 可被上游改写指向恶意提交）。
# 下方注释里的版本号仅用于人工识别，升级时应显式改 SHA + 版本注释。
#
# 令牌最小化：本工作流各 job 只需读取仓库内容（docker-build 是 push: false，
# 产物上传走 artifact 服务而非 token 写权限）。显式声明 contents: read，
# 避免仓库/组织默认权限为读写时，在 pull_request 事件下把过宽的 GITHUB_TOKEN
# 暴露给未合并的 PR 代码。
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────
  # 后端检查
  # ─────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable
      TEST_DATABASE_REQUIRED: "1"
      # TestTaskWorkflowPostgresLifecycle 硬断言 current_database() == starbyte_preview
      # （防止误跑到别的库），缺这个 DSN 它就一直 SKIP。见下一个 job step 的准备步骤。
      STARBYTE_TASK_TEST_DSN: postgres://starbyte:starbyte@localhost:5432/starbyte_preview?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starbyte
          POSTGRES_PASSWORD: starbyte
          POSTGRES_DB: starbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # 下限由 go.mod 的 go 指令决定：excelize v2.11.0 / x/net v0.55+
          # 要求 go 1.25，低版本工具链会直接拒绝构建。
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Format check
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go' || (echo "Code is not formatted. Run 'go fmt ./...'." && exit 1)

      - name: go vet
        run: go vet ./...

      # 不再用 `curl ... install.sh | sh`：那是把远端脚本直接喂给 shell，
      # 既无版本校验也无完整性校验。改为下载固定版本发布包 + sha256 校验。
      #
      # 必须是 v2.x：backend/go.mod 的 go 指令已是 1.25（excelize v2.11.0 /
      # x/net v0.56 / x/crypto v0.53 / x/text v0.38 硬性要求），而 v1 系列
      # （含 v1.64.8）没有任何用 Go 1.25 构建的版本 —— 它自带的 Go 1.22 导入器
      # 读不了 go 1.25 标准库的 export data（"unsupported version: 2"），
      # 会级联报出一大片**假的** typecheck 错误（undefined: jwt / redis 等）。
      # v1 时代靠 .golangci.yml 的 run.go: '1.22' 勉强绕开，但那个开关同时
      # 也把语言版本钉死在 1.22，无法与 go.mod 的 1.25 共存。
      # v2.4.0 起正式支持 go1.25；此处钉 v2.13.2（以 go1.27 构建）。
      # 配置已随之迁移到 v2 schema（见 backend/.golangci.yml 顶部迁移说明）。
      - name: Install golangci-lint (pinned + checksum verified)
        run: |
          set -euo pipefail
          VER="2.13.2"
          TARBALL="golangci-lint-${VER}-linux-amd64.tar.gz"
          SHA256="2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6"
          curl -sSfL -o "/tmp/${TARBALL}" \
            "https://github.com/golangci/golangci-lint/releases/download/v${VER}/${TARBALL}"
          echo "${SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/golangci-lint-${VER}-linux-amd64/golangci-lint" "$HOME/.local/bin/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Build
        run: go build -o starbyte-server ./cmd/server

      - name: Install migrate
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-migrate.sh"

      - name: Migrate test database
        run: migrate -path migrations -database "$TEST_DATABASE_URL" up

      # 任务工作流的集成用例要求**独立的** starbyte_preview 库：
      # 它硬断言 current_database() == starbyte_preview（防止误跑到别的库），
      # 并把所有 fixture 包在一个事务里最后回滚，所以不会污染这个库。
      # 之前 CI 没建这个库，该用例就一直 silently SKIP —— 核心工作流路径
      # 等于没有端到端回归保护。这里补上建库 + 迁移。
      - name: Prepare preview database for task integration test
        run: |
          psql "postgres://starbyte:starbyte@localhost:5432/postgres?sslmode=disable" \
            -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE starbyte_preview'
          migrate -path migrations -database "$STARBYTE_TASK_TEST_DSN" up

      - name: Test
        run: go test -v -race -count=1 -p 1 ./...

      - name: Coverage gate
        run: bash scripts/check-coverage.sh

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.out

  # ─────────────────────────────────────────────────────────
  # 前端检查
  # ─────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test & coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Type check & Build
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # 数据库迁移检查
  # ─────────────────────────────────────────────────────────
  db-migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starbyte
          POSTGRES_PASSWORD: starbyte
          POSTGRES_DB: starbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25'
          cache: false

      - name: Install migrate
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-migrate.sh"

      - name: Run migrations up
        run: |
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" up

      - name: Verify rollback and re-apply
        run: |
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" down 1
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" up

      - name: Preserve customized member approval templates
        run: psql "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" -X -v ON_ERROR_STOP=1 -f backend/migrations/tests/member_application_v2.sql

  # ─────────────────────────────────────────────────────────
  # Docker 镜像构建测试
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: backend
          target: production
          push: false
          load: true
          tags: starbyte-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: frontend
          target: production
          push: false
          load: true
          tags: starbyte-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify backend image size
        run: |
          SIZE=$(docker image inspect starbyte-backend:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Backend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 100 ]; then
            echo "::warning::后端镜像超过 100MB，建议优化"
          fi

      - name: Verify frontend image size
        run: |
          SIZE=$(docker image inspect starbyte-frontend:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Frontend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 100 ]; then
            echo "::warning::前端镜像超过 100MB，建议优化"
          fi
