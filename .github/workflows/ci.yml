name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────
  # 后端检查
  # ─────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable
      TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starbyte
          POSTGRES_PASSWORD: starbyte
          POSTGRES_DB: starbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Format check
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go' || (echo "Code is not formatted. Run 'go fmt ./...'." && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.59.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Build
        run: go build -o starbyte-server ./cmd/server

      - name: Install migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/

      - name: Migrate test database
        run: migrate -path migrations -database "$TEST_DATABASE_URL" up

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Coverage gate
        run: bash scripts/check-coverage.sh

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  # ─────────────────────────────────────────────────────────
  # 前端检查
  # ─────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test & coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Type check & Build
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # 数据库迁移检查
  # ─────────────────────────────────────────────────────────
  db-migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starbyte
          POSTGRES_PASSWORD: starbyte
          POSTGRES_DB: starbyte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/

      - name: Run migrations up
        run: |
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" up

      - name: Verify rollback and re-apply
        run: |
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" down 1
          migrate -path backend/migrations -database "postgres://starbyte:starbyte@localhost:5432/starbyte_test?sslmode=disable" up

  # ─────────────────────────────────────────────────────────
  # Docker 镜像构建测试
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: production
          push: false
          load: true
          tags: starbyte-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: production
          push: false
          load: true
          tags: starbyte-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify backend image size
        run: |
          SIZE=$(docker image inspect starbyte-backend:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Backend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 100 ]; then
            echo "::warning::后端镜像超过 100MB，建议优化"
          fi

      - name: Verify frontend image size
        run: |
          SIZE=$(docker image inspect starbyte-frontend:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Frontend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 100 ]; then
            echo "::warning::前端镜像超过 100MB，建议优化"
          fi

  # ─────────────────────────────────────────────────────────
  # Helm / Kustomize 静态校验（不部署集群）
  # ─────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint & Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.14.0"

      - name: helm lint + template 断言
        run: bash deploy/helm/starbyte/ci-check.sh

