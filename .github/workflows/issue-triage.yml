name: Issue triage

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Always use default branch. issue_comment on a Fork PR would otherwise
      # check out untrusted code and run it with issues:write.
      # 供应链加固（S-19）：钉 commit SHA，不用浮动 tag。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Apply labels and assignees from comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const run = require('./.github/scripts/issue-triage.js');
            await run({ github, context, core });
