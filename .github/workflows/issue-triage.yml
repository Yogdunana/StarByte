name: Issue triage

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Always use default branch. issue_comment on a Fork PR would otherwise
      # check out untrusted code and run it with issues:write.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Apply labels and assignees from comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-triage.js');
            await run({ github, context, core });
