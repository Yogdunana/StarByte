name: Issue triage

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Always use default branch. issue_comment on a Fork PR would otherwise
      # check out untrusted code and run it with issues:write.
      # 供应链加固（S-19）：钉 commit SHA，不用浮动 tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Apply labels and assignees from comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('./.github/scripts/issue-triage.js');
            await run({ github, context, core });
