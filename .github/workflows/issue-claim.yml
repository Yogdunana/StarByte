name: Issue claim

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  sync:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Apply claim or status from comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body || '';
            const login = context.payload.comment.user.login;
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map((l) => l.name);
            const assignees = (issue.assignees || []).map((a) => a.login);
            const isAssignee = assignees.includes(login);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;

            async function addLabels(names) {
              const missing = names.filter((n) => !labels.includes(n));
              if (!missing.length) return;
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: missing });
            }

            async function removeLabel(name) {
              if (!labels.includes(name)) return;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            async function setStatus(next) {
              const statuses = [
                'status:available',
                'status:claimed',
                'status:in-progress',
                'status:review',
              ];
              for (const name of statuses) {
                if (name !== next) await removeLabel(name);
              }
              await addLabels([next]);
            }

            const wantsClaim = /我来认领/.test(body);
            const wantsDrop = /放弃认领/.test(body);
            const wantsProgress = /开始开发|进行中|status:in-progress/.test(body);
            const wantsReview = /提交审查|提交评审|status:review/.test(body);

            if (wantsClaim) {
              if (assignees.length && !isAssignee) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `@${login} 该 Issue 已分配给 ${assignees.map((a) => '@' + a).join('、')}，请先沟通再认领。`,
                });
                return;
              }
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: [login],
              });
              await setStatus('status:claimed');
              return;
            }

            if (wantsDrop) {
              if (!isAssignee) return;
              await github.rest.issues.removeAssignees({
                owner,
                repo,
                issue_number,
                assignees: [login],
              });
              await setStatus('status:available');
              return;
            }

            if (!isAssignee) return;

            if (wantsProgress) {
              await setStatus('status:in-progress');
              return;
            }
            if (wantsReview) {
              await setStatus('status:review');
            }
