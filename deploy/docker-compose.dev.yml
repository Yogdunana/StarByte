version: "3.8"

# ─────────────────────────────────────────────────────────
# StarByte 开发环境 Docker Compose
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d
# 特点：仅启动基础设施（PostgreSQL + Redis + MinIO），前后端本地运行
# ─────────────────────────────────────────────────────────

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    pull_policy: if_not_present
    container_name: starbyte-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starbyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starbyte}
      POSTGRES_DB: ${POSTGRES_DB:-starbyte_dev}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starbyte} -d ${POSTGRES_DB:-starbyte_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    container_name: starbyte-redis-dev
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO：默认 latest，可用 MINIO_IMAGE 覆盖；本地已有镜像时不强制拉取
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    pull_policy: if_not_present
    container_name: starbyte-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-dev-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || wget -qO- http://localhost:9000/minio/health/live >/dev/null || mc ready local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres-dev-data:
  redis-dev-data:
  minio-dev-data:
