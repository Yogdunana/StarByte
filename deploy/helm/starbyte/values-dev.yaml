# 本地 / 实验集群覆盖。禁止用于生产。
# helm upgrade --install starbyte deploy/helm/starbyte \
#   -n starbyte-dev --create-namespace -f deploy/helm/starbyte/values-dev.yaml

global:
  imagePullPolicy: IfNotPresent
  storageClass: ""

namespace:
  name: starbyte-dev
  create: false

backend:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    appEnv: development
    logLevel: debug
  probes:
    liveness:
      initialDelaySeconds: 15
    readiness:
      initialDelaySeconds: 5
    startup:
      initialDelaySeconds: 5
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30081

postgres:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  storage:
    size: 5Gi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  storage:
    size: 1Gi

minio:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  storage:
    size: 5Gi

ingress:
  enabled: false
  tls: []

# 仅开发允许 chart 自建 Secret。值是本地占位，不是生产口令。
secrets:
  create: true
  allowInsecure: true
  secretData:
    DB_PASSWORD: "dev-only-postgres-password"
    REDIS_PASSWORD: "dev-only-redis-password"
    MINIO_ACCESS_KEY: "dev-only-minio-access"
    MINIO_SECRET_KEY: "dev-only-minio-secret"
    JWT_SECRET: "dev-only-jwt-secret-not-for-prod"
