# 后端：ghcr.io/yogdunana/starbyte-backend（与 Helm values 一致，不是 StarByte/backend）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbyte-backend
  namespace: starbyte
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: starbyte
    app.kubernetes.io/part-of: starbyte
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: starbyte
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: starbyte
        app.kubernetes.io/part-of: starbyte
    spec:
      containers:
        - name: backend
          image: ghcr.io/yogdunana/starbyte-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: starbyte-config
            - secretRef:
                name: starbyte-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
