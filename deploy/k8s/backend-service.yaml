apiVersion: v1
kind: Service
metadata:
  name: starbyte-backend
  namespace: starbyte
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: starbyte
    app.kubernetes.io/part-of: starbyte
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: starbyte
---
# frontend/nginx.conf 写死了 Compose DNS http://backend:8080
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: starbyte
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: starbyte
    app.kubernetes.io/part-of: starbyte
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: starbyte
