# StarByte Kubernetes 部署清单 - Issue #102
# 后端 Service：starbyte-backend（ClusterIP，端口 8080）
apiVersion: v1
kind: Service
metadata:
  name: starbyte-backend
  namespace: starbyte
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: starbyte
    app.kubernetes.io/part-of: starbyte
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: starbyte
