apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbyte-frontend-canary
  namespace: starbyte
  labels:
    app: starbyte
    component: frontend
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starbyte
      component: frontend
      track: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: starbyte
        component: frontend
        track: canary
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yogdunana/starbyte-frontend:canary
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
