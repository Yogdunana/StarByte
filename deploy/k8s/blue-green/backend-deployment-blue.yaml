apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbyte-backend-blue
  namespace: starbyte
  labels:
    app: starbyte
    component: backend
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: starbyte
      component: backend
      version: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: starbyte
        component: backend
        version: blue
    spec:
      containers:
        - name: backend
          image: ghcr.io/yogdunana/starbyte-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: starbyte-config
            - secretRef:
                name: starbyte-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
