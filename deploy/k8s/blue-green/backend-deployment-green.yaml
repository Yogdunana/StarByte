# StarByte 蓝绿部署 - Backend Green - Issue #102
# Green 环境（初始空闲，replicaCount=0，发布时扩容）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbyte-backend-green
  namespace: starbyte
  labels:
    app: starbyte
    component: backend
    version: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: starbyte
      component: backend
      version: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: starbyte
        component: backend
        version: green
    spec:
      containers:
        - name: backend
          image: ghcr.io/yogdunana/starbyte-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: starbyte-config
            - secretRef:
                name: starbyte-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
