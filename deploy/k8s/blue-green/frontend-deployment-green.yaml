# StarByte 蓝绿部署 - Frontend Green - Issue #102
# Green 环境（初始空闲，replicaCount=0）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbyte-frontend-green
  namespace: starbyte
  labels:
    app: starbyte
    component: frontend
    version: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: starbyte
      component: frontend
      version: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: starbyte
        component: frontend
        version: green
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yogdunana/starbyte-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
