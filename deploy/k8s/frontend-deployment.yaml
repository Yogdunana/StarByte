# StarByte Kubernetes 部署清单 - Issue #102
# 前端服务 Deployment：starbyte-frontend（React 18 + Vite + Nginx，监听 80）
#   - 镜像：ghcr.io/yogdunana/starbyte-frontend:latest
#   - 滚动更新：maxSurge=1 / maxUnavailable=0
#   - 副本数：2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbyte-frontend
  namespace: starbyte
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: starbyte
    app.kubernetes.io/part-of: starbyte
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: starbyte
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: starbyte
        app.kubernetes.io/part-of: starbyte
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yogdunana/starbyte-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
