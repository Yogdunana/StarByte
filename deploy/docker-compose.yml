# ─────────────────────────────────────────────────────────
# StarByte 生产环境 Docker Compose
#
# 首次部署：
#   sudo starbyte install     # 安装 CLI，并自动生成随机密钥
#   starbyte env-check        # 校验 .env（不打印值）
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
#
# 密钥策略：本文件**不再为任何口令提供兜底默认值**。POSTGRES_PASSWORD /
# REDIS_PASSWORD / MINIO_ROOT_USER / MINIO_ROOT_PASSWORD / JWT_SECRET 全部用
# `${VAR:?...}` 强制必填，值由 `starbyte init` 在安装时自动随机生成并告知运维。
# 未生成 .env 直接 up 会在此处报错退出，而不是带着默认口令上线。
#
# 校园网：基础镜像走 docker.io 官方 tag + daemon.json mirrors（勿写死未验证源）；
# MinIO 默认 latest + pull_policy: if_not_present，避免 RELEASE 钉死 tag 被镜像站 403。
# ─────────────────────────────────────────────────────────

services:
  # PostgreSQL 数据库（仅容器网络访问，不对外暴露端口）
  # 镜像名保持 docker.io 官方 tag；校园网请在 daemon.json 配 registry-mirrors，勿改 FROM/image 为未验证源。
  postgres:
    image: postgres:16-alpine
    pull_policy: if_not_present
    container_name: starbyte-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starbyte}
      # 必填：由 starbyte init 自动随机生成，不提供默认口令
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先运行 starbyte init}
      POSTGRES_DB: ${POSTGRES_DB:-starbyte}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starbyte} -d ${POSTGRES_DB:-starbyte}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（仅容器网络访问，不对外暴露端口）
  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    container_name: starbyte-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先运行 starbyte init} --appendonly yes
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO：默认 latest，可用 MINIO_IMAGE 覆盖。
  # pull_policy: if_not_present — 本地已有兼容镜像时不强制拉 RELEASE 钉死 tag
  #（校园镜像站对 minio/minio:RELEASE.* 常 403，而本机已有 minio/minio:latest）。
  # 残余风险：latest 不可复现。要可复现构建请显式设置 MINIO_IMAGE=<具体 tag 或 digest>。
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    pull_policy: if_not_present
    container_name: starbyte-minio
    command: server /data --console-address ":9001"
    environment:
      # 账号与口令都由 starbyte init 自动随机生成，默认值 minioadmin 已移除
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请先运行 starbyte init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请先运行 starbyte init}
      TZ: Asia/Shanghai
    # 生产环境仅把 MinIO API 绑到回环地址：宿主机本地工具可用，
    # 校园网其它主机无法直连对象存储（也避免绕过 API 鉴权直读对象）。
    # 需要内网直连控制台请用 ssh 端口转发，或显式改成 <内网IP>:9000:9000 并自担风险。
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # latest 与旧 RELEASE 镜像工具集不同：curl / wget / mc 任一成功即可
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || wget -qO- http://localhost:9000/minio/health/live >/dev/null || mc ready local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 后端 API 服务
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: starbyte-backend
    networks:
      default:
      web-proxy:
        ipv4_address: ${STARBYTE_BACKEND_PROXY_IP:-172.30.77.3}
    environment:
      CONFIG_PATH: configs/config.yaml
      APP_ENV: prod
      # Only the frontend reverse proxy may supply client forwarding headers.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.77.2/32}
      # 数据库（与 config.Load 的环境变量名对齐；口令无默认值，见文件头说明）
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-starbyte}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先运行 starbyte init}
      DB_NAME: ${POSTGRES_DB:-starbyte}
      DB_SSLMODE: disable
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先运行 starbyte init}
      REDIS_DB: "0"
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请先运行 starbyte init}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请先运行 starbyte init}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: starbyte
      # JWT：无默认值。后端 loader 另有「长度 ≥32 + 占位词表 + 低熵」校验，
      # 即便有人手工填了弱值也会拒绝启动。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请先运行 starbyte init}
      # 一期校园网 CAS（authserver.smbu.edu.cn）
      CAS_ENABLED: ${CAS_ENABLED:-true}
      CAS_SERVER_URL: ${CAS_SERVER_URL:-https://authserver.smbu.edu.cn/authserver}
      # 漏测无域名：留空则按浏览器访问的 IP 自动拼 callback / 回跳
      CAS_SERVICE_URL: ${CAS_SERVICE_URL:-}
      # 激活邮件只用该 origin，不信请求 Host。漏测默认校园网入口。
      CAS_FRONTEND_URL: ${CAS_FRONTEND_URL:-http://10.100.13.17}
      # 与 backend/configs/config.prod.yaml 的 allow_auto_provision: false 对齐：
      # 默认不自动开户，避免任何能过 CAS 的账号都被静默建成系统账号。
      CAS_ALLOW_AUTO_PROVISION: ${CAS_ALLOW_AUTO_PROVISION:-false}
      CAS_DEFAULT_ROLE: ${CAS_DEFAULT_ROLE:-user}
      # SMTP：密码只从宿主机 .env 注入，勿写进镜像或 compose 明文
      STARBYTE_CONFIG_ENCRYPTION_KEY: ${STARBYTE_CONFIG_ENCRYPTION_KEY:-}
      STARBYTE_SMTP_PASSWORD: ${STARBYTE_SMTP_PASSWORD:-}
      # 备份加密（AES-256）：由 starbyte init 生成（Base64 的 32 字节）。
      # 留空则 pg_dump 产物以明文落对象存储（见 internal/backup/service/artifact.go）。
      STARBYTE_BACKUP_ENCRYPTION_KEY: ${STARBYTE_BACKUP_ENCRYPTION_KEY:-}
      # /metrics：留空则生产环境返回 404（见 cmd/server/main.go 的守卫）
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # 迁移控制
      SKIP_MIGRATION: ${SKIP_MIGRATION:-false}
      MIGRATION_FAIL_FATAL: ${MIGRATION_FAIL_FATAL:-true}
      # 内网镜像内 mc 为占位脚本；默认跳过自动建桶，请手动创建一次
      SKIP_BUCKET_CREATE: ${SKIP_BUCKET_CREATE:-true}
      TZ: Asia/Shanghai
    # 校园 DNS 常把 authserver 解析到不可达 IPv6（如 2001:250:…），
    # 导致容器内 wget CAS 超时、/api/v1/auth/cas/callback 卡住约 20s（nginx 502）。
    # zip 更新会覆盖本文件，故把 extra_hosts 写进仓库，勿再靠机器上手改。
    extra_hosts:
      - "authserver.smbu.edu.cn:${CAS_AUTHSERVER_IP:-10.100.14.250}"
    # 仅绑回环：宿主机 starbyte status / 健康检查可用，校园网其它主机无法直连
    # 后端（原先 0.0.0.0:8080 会把 /metrics 与全部 API 暴露到内网）。
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 一次性种子 / 管理员维护工具（starbyte bootstrap / starbyte admin）
  #
  # 为什么单独成一个服务，而不是「run backend 时覆盖 entrypoint」：
  # backend 在 web-proxy 上有固定 ipv4_address（默认 172.30.77.3），而 compose run
  # 会照搬该服务的网络配置去开第二个容器 —— 于是去抢同一个地址，直接
  # `failed to set up container networking: Address already in use`。
  # 种子只需要连数据库，所以这里只进 default 网络，不碰 web-proxy 的固定 IP。
  #
  # profiles 让它默认不出现在 up -d / ps 里（默认部署行为不变），
  # 只有 CLI 显式带 --profile seed 才会用到。
  seed:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    profiles: ["seed"]
    entrypoint: ["/usr/local/bin/starbyte-seed"]
    command: []
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CONFIG_PATH: configs/config.yaml
      APP_ENV: prod
      # 数据库（与 backend 完全同一套变量，保证种子连的是同一个库）
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-starbyte}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先运行 starbyte init}
      DB_NAME: ${POSTGRES_DB:-starbyte}
      DB_SSLMODE: disable
      # Redis：改口令时要吊销会话，必须能连
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先运行 starbyte init}
      REDIS_DB: "0"
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请先运行 starbyte init}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请先运行 starbyte init}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: starbyte
      # JWT：改口令吊销 access token 时要算剩余 TTL
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请先运行 starbyte init}
      TZ: Asia/Shanghai
    security_opt:
      - no-new-privileges:true

  # 前端 Web 服务（Nginx + API 代理）
  # 容器内以非 root 用户 nginx 运行并监听 8080（非特权端口），故这里映射 80:8080。
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: starbyte-frontend
    networks:
      web-proxy:
        ipv4_address: ${STARBYTE_FRONTEND_PROXY_IP:-172.30.77.2}
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${STARBYTE_HTTP_PORT:-80}:8080"
      # ── HTTPS（S-03）：启用前先在 frontend/nginx.conf 里打开 443 server 块
      #    与 80→443 跳转块，再把证书目录挂进来（见下方 volumes 注释）。
      # - "${STARBYTE_HTTPS_PORT:-443}:443"
    # volumes:
    #   # 证书目录：宿主机 deploy/certs 只读挂入，nginx 的 ssl_certificate 指向
    #   # /etc/nginx/certs/starbyte.crt 与 .key。自签或校园 CA 均可。
    #   - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:

# Dedicated proxy link keeps the trusted hop stable across container recreation.
networks:
  web-proxy:
    ipam:
      config:
        - subnet: ${STARBYTE_PROXY_SUBNET:-172.30.77.0/29}
