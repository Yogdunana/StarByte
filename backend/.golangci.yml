run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck         # 检查未处理的错误
    - gosimple         # 简化代码
    - govet            # go vet
    - ineffassign      # 无效赋值
    - staticcheck      # 静态分析
    - typecheck        # 类型检查
    - unused           # 未使用的变量/函数
    - gofmt            # 代码格式
    - misspell         # 拼写检查
    - nolintlint       # nolint 注释检查
  disable:
    - err113           # 太严格，暂时禁用
    - gochecknoglobals # 允许全局变量
    - gochecknoinits   # 允许 init 函数

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  govet:
    enable-all: true
    disable:
      - shadow
  misspell:
    locale: US
  gofmt:
    simplify: true
  staticcheck:
    checks: ["all", "-SA1019"] # 忽略 deprecated 警告

issues:
  exclude-rules:
    # 测试文件允许一些规则
    - path: _test\.go
      linters:
        - errcheck
        - gosec
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 3
