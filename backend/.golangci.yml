run:
  timeout: 5m
  tests: true
  go: '1.22'

linters:
  enable:
    - errcheck         # 未处理的错误
    - gosimple         # 简化代码
    - govet            # go vet
    - ineffassign      # 无效赋值
    - staticcheck      # 静态分析
    - typecheck        # 类型检查
    - gofmt            # 代码格式
    - nolintlint       # nolint 注释检查
  disable:
    - unused           # 测试文件辅助函数容易误报，后续再加
    - misspell         # 拼写检查（美/英式拼写差异大，后续统一再加）
    - err113
    - gochecknoglobals
    - gochecknoinits

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    exclude-functions:
      - (io.Closer).Close
  govet:
    enable-all: true
    disable:
      - shadow
      - fieldalignment   # 结构体对齐优化，现阶段没必要
      - nilness          # 已知现有代码有恒真判断，后续单独修复
  gofmt:
    simplify: true
  staticcheck:
    checks: ["all", "-SA1019", "-SA9003"]  # 忽略 deprecated 和空分支
  nolintlint:
    allow-unused: false
    require-explanation: true

issues:
  exclude-rules:
    # 测试文件放宽规则
    - path: _test\.go
      linters:
        - errcheck
        - ineffassign
        - gosimple
        - staticcheck  # 测试代码静态检查适当放宽
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 5
