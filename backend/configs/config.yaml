server:
  port: 8080
  mode: debug
  read_timeout: 30
  write_timeout: 30

database:
  host: localhost
  port: 5432
  user: starbyte
  password: starbyte
  dbname: starbyte
  sslmode: disable
  max_open: 100
  max_idle: 10

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "starbyte-secret-key-change-in-production"
  access_token_exp: 7200
  refresh_token_exp: 604800
  issuer: starbyte

logger:
  level: info
  filename: logs/starbyte.log
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: starbyte
  use_ssl: false

# Email / SMTP (optional — leave commented if not used)
email:
  smtp_host: ""
  smtp_port: 587
  username: ""
  password: ""
  from: ""

# 学校统一认证（金智 IDS / CAS）。本地默认关闭，校园网生产见 config.prod.yaml。
cas:
  enabled: false
  server_url: "https://authserver.smbu.edu.cn/authserver"
  service_url: ""
  frontend_url: ""
  # 校园网流程：未知 CAS 用户必须注册绑定，学号不得自动当作 username。
  allow_auto_provision: false
  default_role: member

# CORS
cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Request-Id"
  expose_headers:
    - "X-Request-Id"
  allow_credentials: false

# Google Calendar 单向拉取（密钥只用环境变量，勿提交真实值）
google_calendar:
  client_id: ""
  client_secret: ""
  redirect_uri: ""
