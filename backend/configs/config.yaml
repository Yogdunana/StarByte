# ─────────────────────────────────────────────────────────────
# StarByte 基础配置（本地开发基线）
#
# 本文件里的 password / secret 全是**开发默认值**，只在 APP_ENV=dev 下生效：
#   - APP_ENV=prod 会叠加 config.prod.yaml，其中所有敏感项被清空，改为
#     必须由环境变量注入（deploy/.env，由 `starbyte init` 随机生成）。
#   - 万一有人把这里的弱值带进生产，pkg/config 的 validateProdJWTSecret 会在
#     启动时报错退出（长度 <32 / 命中占位词表 / 低熵 三种都会拒绝）。
# 所以：改这里不会有任何安全问题，别把生产的真实口令写进来。
# ─────────────────────────────────────────────────────────────

server:
  port: 8080
  mode: debug
  read_timeout: 30
  write_timeout: 30

database:
  host: localhost
  port: 5432
  user: starbyte
  password: starbyte
  dbname: starbyte
  sslmode: disable
  max_open: 100
  max_idle: 10

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "starbyte-secret-key-change-in-production"
  access_token_exp: 7200
  refresh_token_exp: 604800
  issuer: starbyte

logger:
  level: info
  filename: logs/starbyte.log
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: starbyte
  use_ssl: false

# Email / SMTP — non-secret defaults, overridable via env or 系统配置.
# Password: STARBYTE_SMTP_PASSWORD (or SMTP_PASSWORD). Never put a real password here.
email:
  smtp_host: smtp.exmail.qq.com
  smtp_port: 465
  ssl_mode: implicit
  username: computerassociation@smbu.edu.cn
  password: ""
  from: computerassociation@smbu.edu.cn
  from_name: StarByte-SMTP

# 学校统一认证（金智 IDS / CAS）。本地默认关闭，校园网生产见 config.prod.yaml。
cas:
  enabled: false
  server_url: "https://authserver.smbu.edu.cn/authserver"
  service_url: ""
  frontend_url: ""
  # 校园网流程：未知 CAS 用户必须注册绑定，学号不得自动当作 username。
  allow_auto_provision: false
  default_role: user

# CORS
cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Request-Id"
  expose_headers:
    - "X-Request-Id"
  allow_credentials: false

# 数据备份（#88）。密码与 AES 密钥只走环境变量，此处不放密钥。
# STARBYTE_BACKUP_ENCRYPTION_KEY 启用 AES-256（CTR + HMAC-SHA256）加密产物。
backup:
  bucket: ""
  prefix: backups
  local_path: ""
  pg_dump_bin: pg_dump
  pg_restore_bin: pg_restore
  timeout_sec: 1800

# Google Calendar 单向拉取（密钥只用环境变量，勿提交真实值）
google_calendar:
  client_id: ""
  client_secret: ""
  redirect_uri: ""
