server:
  port: 8080
  mode: debug
  read_timeout: 30
  write_timeout: 30

database:
  host: localhost
  port: 5432
  user: starbyte
  password: starbyte
  dbname: starbyte
  sslmode: disable
  max_open: 100
  max_idle: 10

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "starbyte-secret-key-change-in-production"
  access_token_exp: 7200
  refresh_token_exp: 604800
  issuer: starbyte

logger:
  level: info
  filename: logs/starbyte.log
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: starbyte
  use_ssl: false
