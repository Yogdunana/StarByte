# ─────────────────────────────────────────────────────────
# StarByte 统一安全响应头（审计项 S-12）
#
# 为什么单独抽一个文件：nginx 的 add_header 不继承 —— 只要某个 location
# 里出现了任意一条 add_header，父级 server 块里的全部 add_header 对该
# location 就整体失效。所以带 add_header 的 location 必须重新 include 本文件，
# 否则静态资源响应会静默丢掉全部安全头。
#
# 本文件只含 add_header，可被 include 到 http / server / location 任一上下文。
# 安装位置：/etc/nginx/snippets/security-headers.conf（刻意不放 conf.d，
# 避免被主配置的 conf.d/*.conf 通配再包含一次）。
# ─────────────────────────────────────────────────────────

# 禁止 MIME 嗅探。文件下载走同源 /api/v1/files/{id}/download（302 到对象存储），
# 若无此项，浏览器可能把上传的异型内容当脚本执行。
add_header X-Content-Type-Options "nosniff" always;

# 点击劫持防护（frame-ancestors 之外的旧浏览器兜底）
add_header X-Frame-Options "SAMEORIGIN" always;

# 跨站引用时只带 origin，避免把站内 URL 泄露给第三方站点
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 关闭本应用不需要的浏览器能力
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# ── CSP ───────────────────────────────────────────────────
# 这是「不阻断应用的实用档」，不是最严档。下面三处是刻意的取舍：
#
#   script-src 'self' 'unsafe-inline'
#     Vite 5 构建时会把 modulepreload polyfill 以内联 <script type="module">
#     注入 index.html，去掉 'unsafe-inline' 会白屏。要真正收紧需改
#     vite.config（关掉 polyfill）或改用 nonce/hash 方案。
#
#   style-src 'self' 'unsafe-inline'
#     antd v5 使用 CSS-in-JS，运行时注入 <style> 标签，无法用 nonce 覆盖。
#
#   connect-src 只放 'self'（不留裸的 ws: / wss:）
#     裸 scheme 源（如 `ws:`）按 CSP 规范匹配**任意主机**的该协议，等价于给
#     所有站点开了一条出站通道；叠加上面的 script-src 'unsafe-inline' 后，
#     一旦出现 XSS，攻击者就能把数据经任意主机的 WebSocket 外传。
#     本项目生产用同源 WS（VITE_WS_URL=/ws，见 frontend/.env.production，
#     buildWSUrl 以 window.location.host 拼接），CSP3 规定 'self' 对同主机的
#     ws/wss 同样匹配，因此 'self' 已足够，无需放行全局 ws:/wss:。
#
# 即便如此，本条策略已经实质生效的约束是：禁止从任意外部源加载脚本
# （script-src 'self'，可挡住注入的第三方 <script src>）、禁止 <object>/<embed>、
# 禁止劫持 <base>、禁止被外站 iframe 嵌套、限制表单提交目标。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# 注意：HSTS 不在这里。HSTS 只在 HTTPS 响应上有意义，写在纯 HTTP 的 server 块里
# 会被浏览器忽略。请在启用 HTTPS 后，把它加到 nginx.conf 末尾的 443 server 块里。
