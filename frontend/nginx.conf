# ─────────────────────────────────────────────────────────
# StarByte 前端 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 运行方式：容器以非 root 用户 nginx(uid 101) 运行，故监听非特权端口 8080，
# 宿主机再由 deploy/docker-compose.yml 把 80 映射到容器的 8080。
# 容器间调用后端的地址仍是 http://backend:8080（后端容器内部端口未变）。
#
# ⚠ 传输安全（审计项 S-03）：本文件默认只提供 HTTP。校园网内明文承载
# 登录口令与 Bearer token，同网段可 ARP 欺骗 / 流量镜像窃取，再叠加
# 固定 JWT 密钥即可直接取得超管权限。上线前必须启用 HTTPS：
# 见文件末尾的 443 server 块模板（含 HSTS）与 80→443 跳转模板。
# ─────────────────────────────────────────────────────────

server {
    listen 8080 default_server;
    server_name _;

    # 隐藏 nginx 版本号，不给攻击者做版本指纹
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（S-12）。放在 server 级，下面每个自带 add_header 的
    # location 都会重新 include 一次 —— 因为 nginx 的 add_header 不继承。
    include /etc/nginx/snippets/security-headers.conf;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 静态资源缓存。
    # 注意：本 location 自带 add_header，会覆盖 server 级 add_header，
    # 所以必须重新 include 安全头，否则 js/css 响应会丢掉 nosniff 等头。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传接口的服务端上限（后端另有 4MB 业务校验）
        client_max_body_size 32m;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─────────────────────────────────────────────────────────
# HTTPS（审计项 S-03）
#
# 443 的 server 块不再内联在本文件里，改为通配 include：
#
#     include /etc/nginx/snippets/https.d/*.conf;
#
# 通配 include 在目录为空时**不报错**，因此不挂载该目录时（默认部署）
# 仍然是纯 HTTP，行为与引入本机制之前完全一致。
#
# 实体配置在 deploy/nginx/https.d/starbyte-https.conf，
# 由 deploy/docker-compose.https.yml 只读挂载进容器。
#
# 开关一律走 CLI，不要手工挂载 —— 那会绕过证书配对校验与状态记录：
#
#     starbyte ssl enable --cert <starbyte.crt> --key <starbyte.key>
#     starbyte ssl status
#     starbyte ssl disable
#
# 注意：上面 server 块里的 `listen 8080 default_server` 是**刻意保留**的。
# 即使启用了 HTTPS，HTTP 入口也必须保持可用 —— 那是证书配错时的逃生通道。
# 因此本机制不做 80→443 强制跳转，理由写在 https.d 那个文件里。
# ─────────────────────────────────────────────────────────

include /etc/nginx/snippets/https.d/*.conf;
